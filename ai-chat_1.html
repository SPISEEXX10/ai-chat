<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой AI Чат</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c27;
    --border: rgba(255,255,255,0.07);
    --accent: #7c6fff;
    --accent2: #ff6fff;
    --text: #f0f0f8;
    --muted: #666680;
    --user-bg: linear-gradient(135deg, #7c6fff, #ff6fff);
    --bot-bg: #1c1c27;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%, rgba(124,111,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 50% at 80% 80%, rgba(255,111,255,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; max-width: 760px; margin: 0 auto; width: 100%; }

  /* Header */
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(10,10,15,0.8);
    backdrop-filter: blur(20px);
    position: sticky;
    top: 0;
  }

  .logo {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #7c6fff, #ff6fff);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 20px rgba(124,111,255,0.4);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(124,111,255,0.4); }
    50% { box-shadow: 0 0 35px rgba(124,111,255,0.7), 0 0 60px rgba(255,111,255,0.2); }
  }

  .header-info h1 { font-family: 'Unbounded', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  .header-info p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4ade80; margin-right: 5px; animation: blink 2s ease infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .persona-select {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    outline: none;
  }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--surface2) transparent;
  }

  .msg-row { display: flex; gap: 10px; animation: fadeUp 0.3s ease; }
  .msg-row.user { flex-direction: row-reverse; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; margin-top: 2px;
  }
  .avatar.bot { background: linear-gradient(135deg, #7c6fff22, #ff6fff22); border: 1px solid rgba(124,111,255,0.3); }
  .avatar.user { background: linear-gradient(135deg, #7c6fff, #ff6fff); }

  .bubble {
    max-width: 72%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.65;
    word-break: break-word;
  }
  .bubble.bot {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }
  .bubble.user {
    background: linear-gradient(135deg, #7c6fff, #c46fff);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble.typing { opacity: 0.6; }
  .typing-dots span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    margin: 0 2px;
    animation: dot 1.2s ease infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  /* Welcome */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    animation: fadeUp 0.5s ease;
  }
  .welcome h2 { font-family: 'Unbounded', sans-serif; font-size: 22px; margin-bottom: 10px; background: linear-gradient(135deg, #7c6fff, #ff6fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .welcome p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sug-btn {
    padding: 8px 14px; border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .sug-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,111,255,0.08); }

  /* Input */
  .input-wrap {
    padding: 16px 20px 20px;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
  }

  .input-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }
  .input-box:focus-within { border-color: rgba(124,111,255,0.5); }

  textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    resize: none;
    line-height: 1.5;
    max-height: 120px;
    min-height: 24px;
  }
  textarea::placeholder { color: var(--muted); }

  #send-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #7c6fff, #ff6fff);
    color: white;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 17px;
    transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 4px 15px rgba(124,111,255,0.4);
  }
  #send-btn:hover { opacity: 0.9; }
  #send-btn:active { transform: scale(0.95); }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }

  .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }

  /* API key setup */
  #setup {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .setup-card h2 { font-family: 'Unbounded', sans-serif; font-size: 18px; margin-bottom: 8px; }
  .setup-card p { color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 24px; }
  .setup-card input {
    width: 100%; padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    margin-bottom: 12px;
  }
  .setup-card input:focus { border-color: var(--accent); }
  .setup-card button {
    width: 100%; padding: 12px;
    background: linear-gradient(135deg, #7c6fff, #ff6fff);
    border: none; border-radius: 10px;
    color: white; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .setup-card a { color: var(--accent); font-size: 12px; display: block; margin-top: 12px; }
</style>
</head>
<body>

<!-- Setup screen -->
<div id="setup">
  <div class="setup-card">
    <div style="font-size:40px;margin-bottom:16px">🤖</div>
    <h2>Мой AI Чат</h2>
    <p>Введи свой Groq API ключ чтобы начать. Ключ сохранится в браузере и нигде не передаётся.</p>
    <input type="password" id="key-input" placeholder="sk-or-..." />
    <button onclick="saveKey()">Начать чат →</button>
    <a href="https://openrouter.ai" target="_blank">Получить бесплатный ключ на openrouter.ai</a>
  </div>
</div>

<div class="app">
  <header>
    <div class="logo">✨</div>
    <div class="header-info">
      <h1>Мой AI</h1>
      <p><span class="status-dot"></span>онлайн</p>
    </div>
    <select class="persona-select" id="persona" onchange="changePersona()">
      <option value="helper">🤖 Помощник</option>
      <option value="friend">😊 Друг</option>
      <option value="teacher">📚 Учитель</option>
      <option value="creative">🎨 Творческий</option>
      <option value="coder">💻 Программист</option>
    </select>
  </header>

  <div id="messages">
    <div class="welcome" id="welcome">
      <h2>Привет! Я твой AI 👋</h2>
      <p>Спроси меня что угодно — я отвечу быстро и по делу</p>
      <div class="suggestions">
        <button class="sug-btn" onclick="suggest('Расскажи интересный факт')">💡 Интересный факт</button>
        <button class="sug-btn" onclick="suggest('Напиши стихотворение про лето')">🌞 Стихотворение</button>
        <button class="sug-btn" onclick="suggest('Как научиться программировать с нуля?')">💻 Как учиться коду</button>
        <button class="sug-btn" onclick="suggest('Придумай крутое название для моего проекта')">🚀 Название проекта</button>
      </div>
    </div>
  </div>

  <div class="input-wrap">
    <div class="input-box">
      <textarea id="msg-input" placeholder="Напиши сообщение..." rows="1" maxlength="2000"></textarea>
      <button id="send-btn" onclick="send()">➤</button>
    </div>
    <div class="hint">Enter — отправить &nbsp;·&nbsp; Shift+Enter — новая строка</div>
  </div>
</div>

<script>
const personas = {
  helper: 'Ты полезный AI ассистент. Отвечай по-русски, кратко и по делу.',
  friend: 'Ты лучший друг. Общайся по-русски неформально, с юмором, тепло и дружески.',
  teacher: 'Ты терпеливый учитель. Объясняй по-русски понятно, с примерами, шаг за шагом.',
  creative: 'Ты творческий помощник — поэт, автор, художник слова. Отвечай по-русски ярко и образно.',
  coder: 'Ты опытный программист. Помогай с кодом, объясняй по-русски технически точно.'
};

let history = [];
let apiKey = '';

function saveKey() {
  const k = document.getElementById('key-input').value.trim();
  if (!k.startsWith('sk-or-')) { alert('Ключ должен начинаться с sk-or-'); return; }
  apiKey = k;
  localStorage.setItem('or_key', k);
  document.getElementById('setup').style.display = 'none';
}

function checkKey() {
  const k = localStorage.getItem('or_key');
  if (k) { apiKey = k; document.getElementById('setup').style.display = 'none'; }
}

function changePersona() {
  history = [];
  document.getElementById('messages').innerHTML = '<div class="welcome" id="welcome"><h2>Персонаж изменён! 🎭</h2><p>Начни новый разговор</p></div>';
}

function suggest(text) {
  document.getElementById('msg-input').value = text;
  send();
}

function addMsg(role, text, typing = false) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'user' ? '👤' : '✨';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}${typing ? ' typing' : ''}`;

  if (typing) {
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  } else {
    bubble.textContent = text;
  }

  row.appendChild(avatar);
  row.appendChild(bubble);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

async function send() {
  const input = document.getElementById('msg-input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  if (!text || !apiKey) return;

  input.value = '';
  input.style.height = 'auto';
  btn.disabled = true;

  addMsg('user', text);
  history.push({ role: 'user', content: text });

  const typingBubble = addMsg('bot', '', true);

  try {
    const persona = document.getElementById('persona').value;
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`,
        'HTTP-Referer': 'https://spiseexx10.github.io',
        'X-Title': 'Мой AI Чат'
      },
      body: JSON.stringify({
        model: 'meta-llama/llama-3.3-70b-instruct:free',
        messages: [
          { role: 'system', content: personas[persona] },
          ...history
        ],
        max_tokens: 1024,
        temperature: 0.8
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const reply = data.choices[0].message.content;
    typingBubble.className = 'bubble bot';
    typingBubble.textContent = reply;
    history.push({ role: 'assistant', content: reply });

    document.getElementById('messages').scrollTop = 999999;
  } catch(e) {
    typingBubble.className = 'bubble bot';
    typingBubble.textContent = '❌ Ошибка: ' + e.message;
  }

  btn.disabled = false;
  input.focus();
}

// Auto-resize textarea
document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

checkKey();
</script>
</body>
</html>
